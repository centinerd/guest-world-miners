<!--
  PLACEHOLDER WORDMARK — build against this, swap it out.

  This is NOT the real asset. It is a stand-in that satisfies the structural
  contract the animation depends on (see CENTINILY BRIEF §3):

    - 9 separate <path> elements, in draw order: C e n t i n i l y
    - each is a single OPEN path (no Z) — a skeleton down the letter's centre,
      NOT an outline/perimeter
    - stroke, never fill
    - first node = where ink appears; path direction = stroke direction
    - the y's exit is EXTENDED, clean, horizontally off the artboard (x > 1600)

  The 20-second acceptance check in §3 passes on this file: C/S commands
  throughout, 9 paths, stroke no fill, no Z, low node count.

  To swap in the real hand-authored wordmark: replace the 9 <path> d= values
  (keep the ids p1..p9 and data-letter attributes, keep draw order, keep the
  y exit running off the right edge). Nothing else needs to change.

  viewBox: 0 0 1600 520   |   baseline ~ y=340   |   split line ~ y=408 (y exit)
-->
